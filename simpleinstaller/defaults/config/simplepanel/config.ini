[panel]
# Blank timezone uses your system timezone.
clock_timezone=
clock=true
calendar_command=simple-calendar
monitor=
height=32
edge_margin=15
top_margin=3
background_opacity=0.75
clock_format=%a %d  %H:%M
interface=
cava=false
invest=false
phone=false
volume_osd=false

[dashboard]
# Show/hide each row. Lists contain 1–4 entries, separated with semicolons.
clocks=true
clock_labels=Koh Tao;Sydney;Berlin;Los Angeles;
clock_zones=Asia/Bangkok;Australia/Sydney;Europe/Berlin;America/Los_Angeles;
# Use \n for a second line. GLib/strftime-style format.
clock_format=%H:%M\n%a %d %b · %Z
markets=true

[markets]
# Shared by panel and dashboard. Use CoinGecko IDs, not ticker symbols.
# Examples: bitcoin;ethereum; or tether-gold;bitcoin;
ids=tether-gold;bitcoin;
labels=GOLD · XAUT;BITCOIN · BTC;
# Supported CoinGecko quote currency, e.g. thb, usd, eur, gbp.
currency=thb
decimals=0
