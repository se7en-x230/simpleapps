[panel]
environment=auto
height=32
edge_margin=10
top_margin=6
background_opacity=0.75
clock_format=%a %d  %H:%M
cava=false
phone=false
volume_osd=false

[layout]
# Semicolon-separated lists; each module may appear once. Empty lists are allowed.
# Workspaces and window-title currently use the Mango adapter only.
left=workspaces;window-title;
center=music;clock;
right=network;volume;battery;

# Optional: add "example" to a layout list to run this module.
[custom.example]
command=printf 'Hello\nMy custom module'
interval=60
timeout=5
max_chars=24
