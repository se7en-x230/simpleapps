# Optional: ~/.config/simplepicker/keyboard/config.ini
[shortcuts]
# auto, mango, hyprland, or none (installed Simple apps only).
environment = auto
# Omit config to use the WM's standard config location.
# config = ~/.config/hypr/hyprland.conf

[keyboard]
# auto shows the layout only when the existing Vial config.json is present.
enabled = auto

[names]
# Optional command-name -> display-name overrides.
# fleet-dashboard = Devices dashboard
# simpleclip = Simpleclip — Clipboard history
